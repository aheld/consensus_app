<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#B9EFC9}
  body{font-family:'Instrument Sans',sans-serif;color:#17211C}
</style>
</head>
<body>
<div style="width:1200px;height:630px;background:#B9EFC9;border:4px solid #17211C;position:relative;overflow:hidden;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box">
  <div style="position:absolute;width:520px;height:520px;border-radius:56% 44% 47% 53%/46% 55% 45% 54%;background:rgba(255,255,255,.45);top:-190px;left:-160px"></div>
  <div style="position:absolute;width:360px;height:360px;border-radius:44% 56% 53% 47%/55% 46% 54% 45%;background:rgba(107,70,240,.09);bottom:-150px;right:170px"></div>

  <div style="position:relative;flex:1;display:flex;flex-direction:column;gap:26px">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="__ICON__" width="52" height="52" alt="">
      <span style="font:700 30px 'Instrument Sans',sans-serif;letter-spacing:-.02em">Consensus</span>
    </div>
    <h1 style="margin:0;font:700 92px/.98 'Instrument Sans',sans-serif;letter-spacing:-.04em;text-wrap:balance">Decide<br>and Dine</h1>
    <p style="margin:0;font:400 25px/1.4 'Instrument Sans',sans-serif;color:#2C3B33;max-width:520px">Put the options up, share one link, everyone ranks. No app, no account.</p>
    <div style="display:flex;align-items:center;gap:14px;margin-top:4px">
      <span style="background:#FF6A2B;color:#fff;border:3px solid #17211C;border-radius:16px;box-shadow:6px 6px 0 #17211C;padding:15px 26px;font:700 24px 'Instrument Sans',sans-serif">Start something</span>
      <span style="font:500 20px 'DM Mono',monospace;color:#3B4A42">dinner.isourthing.com</span>
    </div>
  </div>

  <div style="position:relative;flex:none;width:322px;height:518px;background:#F7FBF8;border:4px solid #17211C;border-radius:40px;box-shadow:12px 12px 0 #17211C;overflow:hidden;display:flex;flex-direction:column;transform:rotate(2.5deg)">
    <div style="flex:none;display:flex;align-items:center;gap:9px;padding:14px 15px;border-bottom:3px solid #17211C;background:#fff">
      <img src="__ICON__" width="20" height="20" alt=""><span style="font:700 14px 'Instrument Sans',sans-serif">Consensus</span>
      <span style="flex:1;text-align:right;font:500 11px 'DM Mono',monospace;color:#5E6D64">LIVE</span>
    </div>
    <div style="flex:none;background:#6B46F0;color:#fff;border-bottom:3px solid #17211C;padding:14px 18px;display:flex;align-items:baseline;justify-content:space-between">
      <span style="font:600 15px 'Instrument Sans',sans-serif;opacity:.9">Dinner Friday?</span>
      <span style="font:500 26px/1 'DM Mono',monospace">04:12</span>
    </div>
    <div style="flex:1;padding:18px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:700 16px 'Instrument Sans',sans-serif">Osteria Mozza <span style="color:#FF6A2B">★</span></span><span style="font:500 13px 'DM Mono',monospace">3</span></div>
        <div style="height:20px;border:3px solid #17211C;border-radius:99px;background:#fff;overflow:hidden"><div style="width:82%;height:100%;background:#6B46F0"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:700 16px 'Instrument Sans',sans-serif">Kismet</span><span style="font:500 13px 'DM Mono',monospace">2</span></div>
        <div style="height:20px;border:3px solid #17211C;border-radius:99px;background:#fff;overflow:hidden"><div style="width:54%;height:100%;background:#6B46F0"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:700 16px 'Instrument Sans',sans-serif;color:#5E6D64;text-decoration:line-through">Sushi Enya</span><span style="background:#FF6A2B;color:#fff;border:2px solid #17211C;border-radius:99px;padding:1px 9px;font:600 11px 'Instrument Sans',sans-serif">VETO</span></div>
        <div style="height:20px;border:3px solid rgba(23,33,28,.25);border-radius:99px;background:repeating-linear-gradient(135deg,rgba(23,33,28,.07) 0 6px,transparent 6px 12px)"></div>
      </div>
      <div style="margin-top:auto;display:flex;gap:8px">
        <div style="width:38px;height:38px;border-radius:50%;border:3px solid #17211C;background:#FFD84D;display:grid;place-items:center;font:700 14px 'Instrument Sans',sans-serif">S</div>
        <div style="width:38px;height:38px;border-radius:50%;border:3px solid #17211C;background:#B9EFC9;display:grid;place-items:center;font:700 14px 'Instrument Sans',sans-serif">A</div>
        <div style="width:38px;height:38px;border-radius:50%;border:3px solid #17211C;background:#FFC2A3;display:grid;place-items:center;font:700 14px 'Instrument Sans',sans-serif">J</div>
        <div style="width:38px;height:38px;border-radius:50%;border:3px dashed rgba(23,33,28,.45);display:grid;place-items:center;font:700 14px 'Instrument Sans',sans-serif;color:#8A968E">R</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
