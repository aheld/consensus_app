<!DOCTYPE html>
<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

<body>
<div style="width:1080px;height:1920px;background:#F0F6F1;border:8px solid #17211C;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:70px;padding:140px 110px">

  <span style="position:relative;align-self:flex-start;background:#FF6A2B;color:#fff;border:7px solid #17211C;border-radius:32px;box-shadow:12px 12px 0 #17211C;padding:32px 52px;font:700 50px 'Instrument Sans',sans-serif">Start something</span>
