<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#FF6A2B}
  body{font-family:'Instrument Sans',sans-serif;color:#17211C}
</style>
</head>
<body>
<div style="width:1200px;height:1200px;background:#FF6A2B;border:8px solid #17211C;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:52px;padding:112px">
  <div style="position:absolute;width:720px;height:720px;border-radius:56% 44% 47% 53%/46% 55% 45% 54%;background:rgba(255,255,255,.16);top:-260px;right:-220px"></div>
  <div style="position:relative;display:flex;align-items:center;gap:24px">
    <img src="__ICON__" width="92" height="92" alt="">
    <span style="font:700 52px 'Instrument Sans',sans-serif;color:#fff;letter-spacing:-.02em">Consensus</span>
  </div>
  <h1 style="position:relative;margin:0;font:700 152px/1 'Instrument Sans',sans-serif;color:#fff;letter-spacing:-.04em">Decide<br>and Dine</h1>
  <div style="position:relative;display:flex;flex-direction:column;gap:28px">
    <p style="margin:0;font:400 44px/1.4 'Instrument Sans',sans-serif;color:rgba(255,255,255,.92);max-width:800px">Share one link. Everyone ranks. The timer decides.</p>
    <span style="align-self:flex-start;background:#B9EFC9;border:6px solid #17211C;border-radius:99px;padding:22px 44px;font:600 38px 'DM Mono',monospace;box-shadow:10px 10px 0 #17211C">dinner.isourthing.com</span>
  </div>
</div>
</body>
</html>
