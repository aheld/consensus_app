# Publishes the design pages to GitHub Pages.
#
# The site is the exact export of the Claude Design project
# (https://claude.ai/design/p/867b0685-278c-4ce4-ae2c-bce2135705af) that lives in
# docs/design/site — seven HTML files plus the dc-runtime (support.js) they load.
# There is no build step: the directory is uploaded as-is.
#
# This deliberately does NOT gate on ci.yml. Nothing here is compiled, nothing here
# reaches the Fly machine, and a red Elixir test says nothing about a static HTML
# export. The mirror of that: fly-deploy.yml ignores docs/**, so publishing a design
# page never restarts production (D-057).

name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/design/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one that has not started.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/design/site

      - id: deployment
        uses: actions/deploy-pages@v4
